<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M50 5 
       L85 20 
       V45 
       C85 70 68 88 50 95 
       C32 88 15 70 15 45 
       V20 Z"
    fill="url(#grad)"
  />

  <!-- Lock -->
  <rect x="35" y="42" width="30" height="28" rx="5" fill="black"/>

  <!-- Lock arc -->
  <path
    d="M40 42 
       V34 
       C40 25 60 25 60 34 
       V42"
    stroke="black"
    stroke-width="5"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Keyhole -->
  <circle cx="50" cy="54" r="4" fill="#22c55e"/>
  <rect x="48" y="58" width="4" height="8" fill="#22c55e"/>

</svg>